name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Ruff + pytest (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # requirements-dev.txt pins pytest-homeassistant-custom-component,
      # which pins the matching Home Assistant version. The unit suite runs
      # against exactly that combination.
      - name: Install test toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip check

      - name: Ruff
        run: |
          pip install "ruff>=0.17.2"
          ruff check custom_components tests

      - name: Manifest sanity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/hb_rf_eth/manifest.json").read_text()
          )
          assert manifest["domain"] == "hb_rf_eth"
          assert manifest["config_flow"] is True
          assert manifest["version"], "custom integrations need a version"
          assert manifest["iot_class"], "iot_class is required"
          print("manifest ok:", manifest["version"])
          PY

      - name: Pytest
        run: pytest -q tests
